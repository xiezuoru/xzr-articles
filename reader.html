<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 - 谢作如文集</title>
<style>
:root{--bg:#525659;--bar:#323639;--ink:#ececec;--accent:#e8b4a6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;background:var(--bar);color:var(--ink);padding:8px 14px;font-size:13.5px}
#bar .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
/* 顶栏「上一篇 / 下一篇」：与返回首页同处导航位，窄屏随 flex-wrap 换行 */
#bar a.nav.off{opacity:.34;pointer-events:none;cursor:default}
#bar button,#bar a{background:#4a4d51;color:var(--ink);border:none;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
#bar button:hover,#bar a:hover{background:#5c6065}
#zoomv{min-width:44px;text-align:center;color:#bbb}
/* 缩放三件套作为一个整体，窄屏换行时不至于「－」和「＋」被拆到两行 */
#bar .zoomgrp{display:flex;align-items:center;gap:12px}
#pages{max-width:960px;margin:18px auto 60px;padding:0 12px}
.page{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.page canvas{display:block;width:100%;height:auto}
.page .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px}
#status{color:#ddd;text-align:center;padding:80px 20px;font-size:14px;line-height:1.9}
/* 窄屏（微信内置浏览器等）：标题独占一行，避免被缩放/下载按钮挤成 0 宽 */
@media (max-width:560px){
  #bar{flex-wrap:wrap;gap:6px;padding:8px 12px}
  #bar .zoomgrp{gap:6px}
  #bar .title{order:-1;flex:1 0 100%;white-space:normal;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    line-height:1.4}
  #bar button,#bar a{padding:5px 10px;font-size:12.5px}
  #pages{margin-top:12px}
}
#status .acts{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#status .acts a{background:#4a4d51;color:var(--ink);border-radius:6px;padding:8px 16px;font-size:13.5px;text-decoration:none}
#status .acts a:hover{background:#5c6065}
/* 文章底部的上一篇/下一篇：读完长文后不必滚回顶部 */
#navb{max-width:960px;margin:28px auto 0;padding:0 16px;display:flex;gap:10px;
  justify-content:space-between;align-items:center}
#navb[hidden]{display:none}
#navb a{flex:0 1 auto;min-width:0;max-width:42%;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:#4a4d51;color:var(--ink);border-radius:6px;
  padding:9px 14px;font-size:13.5px;text-decoration:none}
#navb a:hover{background:#5c6065}
#navb a.off{opacity:.34;pointer-events:none;cursor:default}
#navb a.mid{background:transparent;color:#b9bdc0;padding:9px 6px}
#navb a.mid:hover{background:transparent;color:var(--accent);text-decoration:underline}

/* 页脚：深色阅读页下的友情链接与本站网址 */
#foot{max-width:960px;margin:0 auto 46px;padding:20px 16px 0;
  border-top:1px solid #6a6e72;text-align:center;color:#b9bdc0;font-size:12.5px;line-height:2}
#foot .friends{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;
  gap:4px 18px;margin-bottom:8px}
#foot .friends .lbl{color:#9aa0a4;letter-spacing:1px}
#foot a{color:#d8dbdd;text-decoration:none}
#foot a:hover{color:var(--accent);text-decoration:underline}
#foot .siteurl{color:var(--accent);font-weight:600;letter-spacing:.4px}
</style>
</head>
<body>
<div id="bar">
  <a href="index.html" title="返回首页">← 谢作如文集</a>
  <a class="nav off" id="prev" href="#">‹ 上一篇</a>
  <a class="nav off" id="next" href="#">下一篇 ›</a>
  <span class="title" id="ttl">加载中……</span>
  <span class="zoomgrp"><button id="zout">－</button><span id="zoomv">100%</span><button id="zin">＋</button></span>
  <a id="dl" href="#" download>下载 PDF</a>
</div>
<div id="status">正在加载 PDF……</div>
<div id="pages"></div>

<nav id="navb" hidden>
  <a id="prev2" href="#">‹ 上一篇</a>
  <a class="mid" href="index.html">文章目录</a>
  <a id="next2" href="#">下一篇 ›</a>
</nav>

<footer id="foot">
  <div class="friends">
    <span class="lbl">友情链接</span>
    <a href="https://www.vvplan.cn/" target="_blank" rel="noopener">虚谷计划</a>
    <a href="https://www.steamedu.site/" target="_blank" rel="noopener">全国中小学STEAM教育大会</a>
    <a href="https://www.quickform.cc/" target="_blank" rel="noopener">开源项目QuickForm</a>
    <a href="https://www.xedupro.cn/" target="_blank" rel="noopener">开源项目XEduPro</a>
  </div>
  <div>谢作如文集 · <a class="siteurl" href="https://xzr.quickform.cc/" title="本站网址">xzr.quickform.cc</a></div>
  <div style="color:#9aa0a4">文章版权归原作者及发表刊物所有 · 本站仅供学习交流</div>
</footer>

<!-- PDF.js 优先用站点自带副本：国内网络（尤其微信内置浏览器）访问 cdnjs 常超时或失败，
     自带副本缺失时再动态回退 CDN。 -->
<script src="config.js"></script>
<script src="vendor/pdf.min.js"></script>
<script>
const PDFJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfFromCdn = false;

function ensurePdfJs(){
  if (typeof pdfjsLib !== "undefined") return Promise.resolve(true);
  return new Promise(resolve => {
    const s = document.createElement("script");
    s.src = PDFJS_CDN + "pdf.min.js";
    s.onload = () => { pdfFromCdn = true; resolve(typeof pdfjsLib !== "undefined"); };
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}
</script>
<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const title = params.get("title") || "文章阅读";
document.title = title + " - 谢作如文集";
document.getElementById("ttl").textContent = title;
const dlEl = document.getElementById("dl");
if (file) dlEl.href = file; else dlEl.style.display = "none";

/* ===== 上一篇 / 下一篇 =====
   顺序与首页列表完全一致（build.py 以 (year, title) 倒序输出），
   所以「上一篇」= 更新的文章，「下一篇」= 更早的文章。 */
let DATA = [], IDX = -1;
const PDF_PREFIX = (window.ARTICLES_CONFIG && ARTICLES_CONFIG.PDF_BASE)
  ? ARTICLES_CONFIG.PDF_BASE.replace(/\/+$/, "") + "/" : "";
const pdfUrl = a => PDF_PREFIX + a.path.split("/").map(encodeURIComponent).join("/");
// 与 index.html 的 readerUrl 保持一致：带 id 便于精确定位，id 缺失时按 PDF 路径兜底
const readerUrl = a => "reader.html?file=" +
  encodeURIComponent(new URL(pdfUrl(a), location.href).href) +
  "&title=" + encodeURIComponent(a.title) +
  "&id=" + encodeURIComponent(a.id);

// 本地 file:// 双击打开时 fetch 本地文件被禁止，退回 <script> 加载 articles.js
function loadDataByScript(base){
  return new Promise(resolve => {
    window.ARTICLES_DATA = undefined;
    const s = document.createElement("script");
    s.src = base + "articles.js";
    s.onload = () => resolve(
      Array.isArray(window.ARTICLES_DATA) && window.ARTICLES_DATA.length
        ? window.ARTICLES_DATA : null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}
// 同 index.html：Cloudflare Pages 对不存在的路径也回 200 兜底页，
// 必须校验 content-type 与 JSON 结构，再退回 articles.js
async function loadData(){
  for (const b of ["", "site/dist/"]){
    try{
      const r = await fetch(b + "articles.json");
      if (!r.ok) continue;
      if ((r.headers.get("content-type") || "").includes("html")) continue;
      const d = await r.json();
      if (Array.isArray(d) && d.length) return d;
    }catch(e){}
  }
  for (const b of ["site/dist/", ""]){
    const d = await loadDataByScript(b);
    if (d) return d;
  }
  return null;
}

function locate(){
  const byId = params.get("id");
  if (byId){
    const i = DATA.findIndex(a => a.id === byId);
    if (i >= 0) return i;
  }
  if (!file) return -1;
  let target;
  try { target = decodeURIComponent(new URL(file, location.href).pathname); }
  catch(e){ target = decodeURIComponent(file); }
  return DATA.findIndex(a => target.endsWith("/" + a.path));
}

function wireNav(){
  const label = d => d < 0 ? "上一篇" : "下一篇";
  const link = (node, d) => {
    if (!node) return;
    const j = IDX + d;
    const a = (IDX >= 0 && j >= 0 && j < DATA.length) ? DATA[j] : null;
    if (!a){                       // 首篇 / 末篇：置灰且不可点
      node.classList.add("off");
      node.removeAttribute("href");
      node.title = "";
      return;
    }
    node.classList.remove("off");
    node.href = readerUrl(a);
    node.title = label(d) + "：" + a.title + (a.year ? "（" + a.year + "）" : "");
  };
  [["prev", -1], ["next", 1], ["prev2", -1], ["next2", 1]].forEach(([id, d]) =>
    link(document.getElementById(id), d));
  if (IDX >= 0) document.getElementById("navb").hidden = false;
}

// 左右方向键翻篇（输入框内不拦截）
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = ((e.target && e.target.tagName) || "").toLowerCase();
  if (t === "input" || t === "textarea" || t === "select") return;
  const node = e.key === "ArrowLeft" ? document.getElementById("prev")
             : e.key === "ArrowRight" ? document.getElementById("next") : null;
  if (node && node.getAttribute("href")) node.click();
});

// 导航只是增强：索引取不到也不影响正文阅读，因此单独 try/catch
(async function initNav(){
  try{
    const d = await loadData();
    if (!d) return;
    DATA = d;
    IDX = locate();
    if (IDX >= 0) wireNav();
  }catch(e){}
})();

let pdf = null, zoom = 1.0;
const pagesEl = document.getElementById("pages");
const statusEl = document.getElementById("status");
const rendered = new Set();

function baseWidth(){ return Math.min(960, window.innerWidth - 24); }

async function renderPage(n){
  if (rendered.has(n)) return;
  rendered.add(n);
  const holder = document.getElementById("pg" + n);
  if (!holder) return;
  const page = await pdf.getPage(n);
  const unscaled = page.getViewport({scale:1});
  const scale = baseWidth() * zoom / unscaled.width;
  const vp = page.getViewport({scale});
  const canvas = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = vp.width * dpr; canvas.height = vp.height * dpr;
  canvas.style.width = "100%";
  const ctx = canvas.getContext("2d");
  await page.render({canvasContext: ctx,
    transform: [dpr,0,0,dpr,0,0], viewport: vp}).promise;
  holder.innerHTML = ""; holder.appendChild(canvas);
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) renderPage(+e.target.dataset.n); });
}, {rootMargin: "600px 0px"});

async function build(){
  pdf = await pdfjsLib.getDocument(file).promise;
  statusEl.style.display = "none";
  pagesEl.innerHTML = "";
  rendered.clear();
  for (let n = 1; n <= pdf.numPages; n++){
    const page = await pdf.getPage(n);
    const vp = page.getViewport({scale:1});
    const div = document.createElement("div");
    div.className = "page"; div.id = "pg" + n; div.dataset.n = n;
    div.style.aspectRatio = vp.width + "/" + vp.height;
    div.innerHTML = '<div class="ph">第 ' + n + " 页</div>";
    pagesEl.appendChild(div);
    io.observe(div);
  }
}

document.getElementById("zin").onclick = () => setZoom(zoom + 0.2);
document.getElementById("zout").onclick = () => setZoom(Math.max(0.4, zoom - 0.2));
function setZoom(z){
  zoom = z;
  document.getElementById("zoomv").textContent = Math.round(z*100) + "%";
  rendered.clear();
  document.querySelectorAll(".page").forEach(d => {
    d.innerHTML = '<div class="ph">第 ' + d.dataset.n + " 页</div>";
  });
  // 触发当前可视区域重绘
  io.takeRecords();
  document.querySelectorAll(".page").forEach(d => {
    const r = d.getBoundingClientRect();
    if (r.bottom > -600 && r.top < innerHeight + 600) renderPage(+d.dataset.n);
  });
}

// 统一的失败提示：给「返回首页 / 新窗口打开 / 下载」三条出路，
// 微信等内置浏览器里 PDF.js 不可用时用户仍有办法看到文章
function fail(msg, withFile){
  let extra = '<div class="acts"><a href="index.html">← 返回首页</a>';
  if (withFile && file){
    extra += '<a href="' + file + '" target="_blank" rel="noopener">新窗口打开 PDF</a>' +
             '<a href="' + file + '" download>下载 PDF</a>';
  }
  extra += "</div>";
  statusEl.innerHTML = msg + extra;
  statusEl.style.display = "";
}

(async function start(){
  if (!file) {
    fail("这个链接缺少文章参数，无法定位 PDF。<br>请回到首页重新点击文章。", false);
    return;
  }
  if (!await ensurePdfJs()) {
    fail("PDF 阅读器（PDF.js）没能加载，可能是网络受限。<br>可以直接打开或下载这篇文章：", true);
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    pdfFromCdn ? PDFJS_CDN + "pdf.worker.min.js" : "vendor/pdf.worker.min.js";
  try {
    await build();
  } catch (e) {
    // 自带 worker 取不到时（缓存/路径异常），退回 CDN worker 再试一次
    if (!pdfFromCdn && location.protocol !== "file:") {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN + "pdf.worker.min.js";
        await build();
        return;
      } catch (e2) {}
    }
    if (location.protocol === "file:") {
      statusEl.innerHTML = "浏览器不允许本地直接打开时用脚本读取 PDF（搜索、筛选不受影响）。<br><br>" +
        "在线阅读请任选一种：<br>" +
        "1. 点右上角「下载 PDF」，用浏览器自带的阅读器打开；<br>" +
        "2. 在仓库根目录运行 <code style='color:#e8b4a6'>python3 -m http.server 8000</code>，" +
        "再访问 <code style='color:#e8b4a6'>http://localhost:8000/</code>。";
    } else {
      fail("PDF 加载失败：" + ((e && e.message) || e) + "<br>可以试试直接打开或下载：", true);
    }
  }
})();
</script>
</body>
</html>
